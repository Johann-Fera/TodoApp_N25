name: Line no pipe

on:
    push:
      branches: ["main"]

jobs:
  testes-unitarios:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: configurar o ambiente virtual
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
      
      - name: Executar os testes
        run: |
          pytest tests/unit
  testes-integracao:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: configurar o ambiente virtual
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
      
      - name: Executar os testes
        run: |
          pytest tests/integration
  quality-gate:
    runs-on: ubuntu-latest
    needs:
      - testes-unitarios
      - testes-integracao
    steps:
      - name: Validar QUality Gate
        run: |
          echo "Validando Quality Gate"
          echo "Testes unitários aprovados!"
          echo "Testes de integração aprovados!"
          echo "Quality Gate liberado"
  testes-end2end:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: configurar o ambiente virtual
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
      
      - name: Executar os testes
        run: |
          pytest tests/e2e